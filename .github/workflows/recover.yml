name: Récupérer un numéro

# Enregistre dans issues/ le numéro produit par une exécution précédente (par exemple un
# essai), sans refaire appel à l'IA. Indiquer le numéro de l'exécution (visible dans son
# adresse : .../actions/runs/<numéro>).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Numéro de l'exécution qui a produit le numéro"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: numero
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: recupere
      - name: Enregistrer le numéro
        run: |
          mkdir -p issues
          cp recupere/issues/*.md issues/
          git config user.name "newsletter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issues/
          git commit -m "Numéro récupéré depuis l'exécution ${{ inputs.run_id }}" || exit 0
          git push
