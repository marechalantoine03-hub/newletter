name: Collecte des sources

# Phase 1 : lancement manuel (onglet Actions > Collecte des sources > Run workflow).
# La programmation quotidienne viendra en phase 4.
on:
  pull_request:  # vérifie les sources à chaque proposition de modification
  workflow_dispatch:
    inputs:
      hours:
        description: "Fenêtre de collecte, en heures"
        default: "24"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collecter les articles
        run: python -m newsletter.collect --hours "${{ inputs.hours || '24' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collecte
          path: data/
