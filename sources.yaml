# Liste des sources de la newsletter.
# Chaque source : name, url (flux RSS/Atom), region, type, lang, topics.
#   region : europe | ameriques | asie | moyen-orient | afrique | monde
#   type   : presse | agence | analyse | newsletter | etat | tech
#   topics : geopolitique, economie, tech (une ou plusieurs)
#   site   : domaine du média ; si le flux échoue, on passe par Google News limité à ce site
#   fallback_urls (facultatif) : autres adresses de flux à essayer
# Pour ajouter une source : copier un bloc et changer les valeurs.
# Pour en retirer une : supprimer le bloc, ou mettre "enabled: false".

